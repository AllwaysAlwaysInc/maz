<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MandalOz 3D — CROW Chain NFT Game</title>
  <link rel="icon" href="/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="/crow_sdk.js"></script>
  <style>
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .mandala-spin {
      animation: spinSlow 28s linear infinite;
      transform-origin: center;
    }
    @keyframes holoShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .mythic-card {
      background: linear-gradient(135deg, rgba(236,72,153,0.18), rgba(168,85,247,0.22), rgba(56,189,248,0.18), rgba(250,204,21,0.18));
      background-size: 300% 300%;
      animation: holoShift 6s ease infinite;
      box-shadow: 0 0 22px rgba(236,72,153,0.35), inset 0 0 14px rgba(250,204,21,0.18);
    }
    .legendary-card {
      box-shadow: 0 0 16px rgba(244,63,94,0.28);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden">
  <div id="root" class="max-w-full overflow-x-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const RARITY_LEVELS = {
      common:    { chance: 50, color: "#94a3b8", border: "border-slate-600",    badge: "bg-slate-800 text-slate-300",    multiplier: 1 },
      uncommon:  { chance: 30, color: "#38bdf8", border: "border-sky-500/60",   badge: "bg-sky-950 text-sky-300",        multiplier: 1.5 },
      rare:      { chance: 15, color: "#a78bfa", border: "border-violet-500/70",badge: "bg-violet-950 text-violet-300",  multiplier: 2 },
      epic:      { chance: 3.5,color: "#f59e0b", border: "border-amber-500/80", badge: "bg-amber-950 text-amber-300",    multiplier: 3 },
      legendary: { chance: 1.2,color: "#ef4444", border: "border-rose-500",     badge: "bg-rose-950 text-rose-300",      multiplier: 5 },
      mythic:    { chance: 0.3,color: "#f472b6", border: "border-fuchsia-400",  badge: "bg-gradient-to-r from-fuchsia-600 to-amber-500 text-white", multiplier: 8 }
    };

    const CHARACTER_SKINS = [
      { id: "dragon_armor",   label: "Dragon Armor Hero",   url: "/models/character.glb" },
      { id: "warlord",        label: "Ethereal Warlord",    url: "/models/meshy/Meshy_AI_Ethereal_Warlord_1115233523_texture.glb" },
      { id: "inferno_knight", label: "Inferno Knight",      url: "/models/meshy/Meshy_AI_Inferno_Knight_1115232943_texture.glb" },
      { id: "void_knight",    label: "Void Knight",         url: "/models/meshy/Meshy_AI_Void_Knight_1115232910_texture.glb" },
      { id: "royal_sentinel", label: "Royal Sentinel",      url: "/models/meshy/Meshy_AI_Royal_Sentinel_1115232757_texture.glb" },
      { id: "shadow_mage",    label: "Shadow Enchanter",    url: "/models/meshy/Meshy_AI_Shadow_Enchanter_1115233000_texture.glb" },
      { id: "forest_guard",   label: "Forest Guardian",     url: "/models/meshy/Meshy_AI_Forest_Guardian_1115232917_texture.glb" },
      { id: "celestial_guard",label: "Celestial Guardian",  url: "/models/meshy/Meshy_AI_Celestial_Guardian_1115232922_texture.glb" }
    ];

    const ELEMENT_COLORS = {
      fire: "#f97316",
      water: "#38bdf8",
      earth: "#22c55e",
      air: "#e2e8f0",
      spirit: "#c084fc",
      light: "#facc15",
      shadow: "#818cf8"
    };

    const TIER_TITLES = [
      [1, "Novice"], [10, "Apprentice"], [20, "Adept"], [30, "Ringbearer"],
      [40, "Master"], [50, "Grandmaster"], [65, "Archon"], [80, "Aetheris Legend"]
    ];
    const LEVELS = Array.from({ length: 85 }, (_, idx) => {
      const lv = idx + 1;
      const xp = lv === 1 ? 0 : Math.round(100 * Math.pow(lv - 1, 1.65));
      let title = "Novice";
      for (const [minLv, tName] of TIER_TITLES) { if (lv >= minLv) title = tName; }
      return { level: lv, name: title, xp };
    });

    function calcLevel(xpVal) {
      let lv = 1;
      for (const row of LEVELS) {
        if (xpVal >= row.xp) lv = row.level;
      }
      return lv;
    }

    function randomMandala(tier = 1, forcedRarity = null) {
      let rarity = forcedRarity || "common";
      if (!forcedRarity) {
        const roll = Math.random() * 100;
        let cum = 0;
        for (const [rName, rData] of Object.entries(RARITY_LEVELS)) {
          cum += rData.chance;
          if (roll < cum) { rarity = rName; break; }
        }
      }
      const patterns = ["circular", "triangular", "square", "pentagonal", "hexagonal", "octagonal"];
      const elements = ["fire", "water", "earth", "air", "spirit", "light", "shadow"];
      const el = elements[Math.floor(Math.random() * elements.length)];
      const pat = patterns[Math.floor(Math.random() * patterns.length)];
      const mult = RARITY_LEVELS[rarity]?.multiplier || 1;
      const baseSellByRarity = { common: 35, uncommon: 55, rare: 90, epic: 160, legendary: 300 };
      return {
        id: Date.now() + Math.floor(Math.random() * 1000),
        name: `${el[0].toUpperCase() + el.slice(1)} ${pat[0].toUpperCase() + pat.slice(1)}`,
        tier,
        rarity,
        pattern: pat,
        elements: [el],
        fusionPower: Math.round((55 + Math.floor(Math.random() * 45)) * mult),
        marketValue: baseSellByRarity[rarity] || 35
      };
    }

    function MandalaArt({ mandala, size = "w-24 h-24" }) {
      const primary = ELEMENT_COLORS[(mandala.elements || [])[0]] || "#38bdf8";
      const secondary = ELEMENT_COLORS[(mandala.elements || [])[1]] || RARITY_LEVELS[mandala.rarity]?.color || "#a78bfa";
      const sidesMap = { circular: 12, triangular: 3, square: 4, pentagonal: 5, hexagonal: 6, octagonal: 8 };
      const sides = sidesMap[mandala.pattern] || 6;

      const buildPoly = (r, rotOffset = 0) => {
        const pts = [];
        for (let i = 0; i < sides; i++) {
          const a = ((Math.PI * 2) / sides) * i + rotOffset;
          pts.push(`${(50 + r * Math.cos(a)).toFixed(1)},${(50 + r * Math.sin(a)).toFixed(1)}`);
        }
        return pts.join(" ");
      };

      return (
        <svg viewBox="0 0 100 100" className={`${size} mx-auto drop-shadow-lg`}>
          <defs>
            <radialGradient id={`g-${mandala.id}`} cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor={primary} stopOpacity="0.35" />
              <stop offset="100%" stopColor="#0f172a" stopOpacity="0.05" />
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="46" fill={`url(#g-${mandala.id})`} stroke={primary} strokeWidth="1.2" strokeOpacity="0.6" />
          <g className="mandala-spin">
            <polygon points={buildPoly(40, 0)} fill="none" stroke={primary} strokeWidth="1.6" />
            <polygon points={buildPoly(30, Math.PI / sides)} fill="none" stroke={secondary} strokeWidth="1.4" />
            <polygon points={buildPoly(18, 0)} fill={primary} fillOpacity="0.18" stroke={primary} strokeWidth="1.2" />
          </g>
          <circle cx="50" cy="50" r="5" fill={secondary} />
        </svg>
      );
    }

    const ELEMENT_ADVANTAGE = {
      fire:   { strong: ["earth", "air"],   weak: ["water"] },
      water:  { strong: ["fire"],           weak: ["earth"] },
      earth:  { strong: ["water"],          weak: ["fire", "air"] },
      air:    { strong: ["earth"],          weak: ["fire"] },
      light:  { strong: ["shadow"],         weak: ["spirit"] },
      shadow: { strong: ["light"],          weak: ["spirit"] },
      spirit: { strong: ["shadow", "light"],weak: [] }
    };

    function getFamiliarStats(fam) {
      const xp = fam?.famXp || 0;
      const famLevel = Math.min(30, Math.floor(Math.sqrt(xp / 20)) + 1);
      const base = fam?.powerBonus || 22;
      const alphaMult = fam?.isAlpha ? 1.25 : 1;
      return {
        famLevel,
        nextLevelXp: Math.pow(famLevel, 2) * 20,
        maxHp: Math.round((60 + base * 1.4 + famLevel * 12) * alphaMult),
        atk: Math.round((14 + base * 0.55 + famLevel * 4) * alphaMult),
        def: Math.round((10 + base * 0.35 + famLevel * 3) * alphaMult),
        spd: Math.round((12 + famLevel * 2) * alphaMult)
      };
    }

    function getFamiliarMoves(fam) {
      const el = (fam?.elements || ["earth"])[0] || "earth";
      const sp = fam?.species || "Bat";
      const spMoves = {
        Bat:        ["Wing Slash", "Sonic Screech", "Night Dive", "Phantom Eclipse"],
        Hound:      ["Fang Bite", "Howl Charge", "Magma Pounce", "Sunburst Roar"],
        Dragon:     ["Claw Rend", "Flame Gust", "Sky Slam", "Cataclysm Breath"],
        Owl:        ["Talon Strike", "Gale Feather", "Moonbeam Gaze", "Astral Dive"],
        Sabertooth: ["Saber Slash", "Shadow Stalk", "Crushing Jaw", "Apex Frenzy"],
        Serpent:    ["Venom Fang", "Coil Crush", "Tidal Surge", "Abyssal Strike"]
      };
      const names = spMoves[sp] || spMoves.Bat;
      return [
        { name: names[0], power: 18, element: "neutral", unlockLv: 1 },
        { name: names[1], power: 26, element: el,        unlockLv: 1 },
        { name: names[2], power: 36, element: el,        unlockLv: 3 },
        { name: names[3], power: 50, element: el,        unlockLv: 5 }
      ];
    }

    function buildFamiliarMesh(THREE, fam) {
      const group = new THREE.Group();
      const el = (fam?.elements || ["spirit"])[0] || "spirit";
      const col = new THREE.Color(ELEMENT_COLORS[el] || "#c084fc");
      const dark = col.clone().multiplyScalar(0.45);
      const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.35, metalness: 0.25 });
      const darkMat = new THREE.MeshStandardMaterial({ color: dark, roughness: 0.45, metalness: 0.2 });
      const eyeMat = new THREE.MeshBasicMaterial({ color: fam?.isAlpha ? 0xfacc15 : 0xffffff });
      const sp = fam?.species || "Bat";

      if (sp === "Bat") {
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 16), darkMat);
        body.scale.set(0.85, 1.15, 0.85);
        group.add(body);
        [-1, 1].forEach(side => {
          const wing = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.55, 0.08), mat);
          wing.position.set(side * 0.8, 0.1, 0);
          wing.rotation.z = side * 0.28;
          group.add(wing);
          const ear = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.32, 6), mat);
          ear.position.set(side * 0.2, 0.55, 0.05);
          group.add(ear);
          const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), eyeMat);
          eye.position.set(side * 0.14, 0.18, 0.36);
          group.add(eye);
        });
      } else if (sp === "Dragon") {
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.48, 1.15, 10), mat);
        torso.rotation.x = Math.PI / 2.3;
        group.add(torso);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.42, 0.65), darkMat);
        head.position.set(0, 0.55, 0.62);
        group.add(head);
        [-1, 1].forEach(side => {
          const wing = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.75, 0.07), darkMat);
          wing.position.set(side * 0.95, 0.55, -0.05);
          wing.rotation.z = side * 0.35;
          group.add(wing);
          const horn = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.4, 6), eyeMat);
          horn.position.set(side * 0.18, 0.88, 0.5);
          horn.rotation.x = -0.35;
          group.add(horn);
        });
        const tail = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.0, 8), mat);
        tail.position.set(0, -0.25, -0.95);
        tail.rotation.x = -Math.PI / 2.2;
        group.add(tail);
      } else if (sp === "Owl") {
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), mat);
        body.scale.set(0.9, 1.25, 0.85);
        group.add(body);
        const beak = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.22, 6), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
        beak.position.set(0, 0.22, 0.45);
        beak.rotation.x = Math.PI / 2;
        group.add(beak);
        [-1, 1].forEach(side => {
          const wing = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.85, 0.25), darkMat);
          wing.position.set(side * 0.52, 0, 0);
          wing.rotation.z = side * 0.15;
          group.add(wing);
          const eye = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), eyeMat);
          eye.position.set(side * 0.18, 0.32, 0.36);
          group.add(eye);
        });
      } else if (sp === "Serpent") {
        for (let i = 0; i < 6; i++) {
          const seg = new THREE.Mesh(new THREE.SphereGeometry(0.28 - i * 0.03, 12, 12), i % 2 === 0 ? mat : darkMat);
          seg.position.set(Math.sin(i * 0.9) * 0.45, -0.35 + i * 0.18, Math.cos(i * 0.9) * 0.35);
          group.add(seg);
        }
        const head = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.55, 8), mat);
        head.position.set(0.1, 0.72, 0.35);
        head.rotation.x = Math.PI / 2;
        group.add(head);
      } else {
        // Hound or Sabertooth
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.55, 1.15), mat);
        body.position.set(0, 0.1, 0);
        group.add(body);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.48, 0.55), darkMat);
        head.position.set(0, 0.48, 0.65);
        group.add(head);
        [-0.25, 0.25].forEach(lx => {
          [-0.4, 0.4].forEach(lz => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.55, 8), darkMat);
            leg.position.set(lx, -0.35, lz);
            group.add(leg);
          });
        });
        const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.04, 0.55, 8), mat);
        tail.position.set(0, 0.38, -0.7);
        tail.rotation.x = 0.6;
        group.add(tail);
        if (sp === "Sabertooth") {
          [-0.12, 0.12].forEach(fx => {
            const fang = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.28, 6), eyeMat);
            fang.position.set(fx, 0.22, 0.9);
            fang.rotation.x = Math.PI;
            group.add(fang);
          });
        }
      }

      if (fam?.isAlpha) {
        const aura = new THREE.Mesh(
          new THREE.TorusGeometry(0.95, 0.04, 8, 32),
          new THREE.MeshBasicMaterial({ color: 0xfacc15 })
        );
        aura.rotation.x = Math.PI / 2;
        aura.position.y = -0.55;
        group.add(aura);
      }
      return group;
    }

    const MESHY_MODEL_PATHS = {
      character:  "/models/character.glb",
      Bat:        "/models/bat.glb",
      Hound:      "/models/hound.glb",
      Dragon:     "/models/dragon.glb",
      Owl:        "/models/owl.glb",
      Sabertooth: "/models/sabertooth.glb",
      Serpent:    "/models/serpent.glb"
    };

    function ThreeModelViewer({ mode = "familiar", player = null, item = null, customGlb = "", height = "250px" }) {
      const mountRef = React.useRef(null);
      useEffect(() => {
        const el = mountRef.current;
        if (!el || !window.THREE) return;
        const THREE = window.THREE;
        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        } catch {
          return;
        }
        const w = el.clientWidth || 320;
        const h = el.clientHeight || 250;
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        el.innerHTML = "";
        el.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
        camera.position.set(0, 1.35, 3.8);

        let controls = null;
        if (THREE.OrbitControls) {
          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.enablePan = false;
          controls.minDistance = 2.0;
          controls.maxDistance = 7.5;
        }

        scene.add(new THREE.HemisphereLight(0xe0f2fe, 0x0f172a, 0.85));
        scene.add(new THREE.AmbientLight(0xffffff, 0.45));
        const keyLight = new THREE.DirectionalLight(0xfffbeb, 1.35);
        keyLight.position.set(3, 5, 4);
        scene.add(keyLight);
        const rimLight = new THREE.PointLight(0x38bdf8, 1.4, 14);
        rimLight.position.set(-3, 2, -2);
        scene.add(rimLight);

        const rootGroup = new THREE.Group();
        const pedestal = new THREE.Mesh(
          new THREE.CylinderGeometry(1.35, 1.5, 0.18, 32),
          new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7, roughness: 0.25 })
        );
        pedestal.position.y = -0.95;
        rootGroup.add(pedestal);
        const runeRing = new THREE.Mesh(
          new THREE.TorusGeometry(1.36, 0.03, 8, 36),
          new THREE.MeshBasicMaterial({ color: 0x10b981 })
        );
        runeRing.rotation.x = Math.PI / 2;
        runeRing.position.y = -0.85;
        rootGroup.add(runeRing);

        const contentGroup = new THREE.Group();
        rootGroup.add(contentGroup);
        let mixer = null;
        let cancelled = false;

        const addProceduralFallback = () => {
          contentGroup.clear();
          if (mode === "character") {
            const hero = new THREE.Group();
            const hasChest = Boolean(player?.equipped?.chest);
            const hasHelm = Boolean(player?.equipped?.head);
            const hasWpn = Boolean(player?.equipped?.weapon);
            const armorMat = new THREE.MeshStandardMaterial({ color: hasChest ? 0x6366f1 : 0x475569, metalness: 0.45, roughness: 0.35 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.5 });

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.28, 0.85, 12), armorMat);
            torso.position.y = 0.05;
            hero.add(torso);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16), hasHelm ? new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.6 }) : skinMat);
            head.position.y = 0.72;
            hero.add(head);
            [-0.14, 0.14].forEach(lx => {
              const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.55, 8), armorMat);
              leg.position.set(lx, -0.58, 0);
              hero.add(leg);
            });
            if (hasWpn) {
              const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.05, 0.08), new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 }));
              blade.position.set(0.45, 0.25, 0.18);
              blade.rotation.z = -0.35;
              hero.add(blade);
            }
            const halo = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.03, 8, 28), new THREE.MeshBasicMaterial({ color: 0xa78bfa }));
            halo.position.set(0, 0.35, -0.35);
            hero.add(halo);
            hero.position.x = 0;
            contentGroup.add(hero);

            const activeFam = (player?.familiars || []).find(f => f.id === player?.equipped?.familiar);
            if (activeFam) {
              const famMesh = buildFamiliarMesh(THREE, activeFam);
              famMesh.scale.setScalar(0.55);
              famMesh.position.set(0.75, -0.1, 0.25);
              contentGroup.add(famMesh);
            }
          } else {
            const famMesh = buildFamiliarMesh(THREE, item || { species: "Dragon", elements: ["fire"] });
            famMesh.position.y = 0.05;
            contentGroup.add(famMesh);
          }
        };

        addProceduralFallback();

        const targetKey = mode === "character" ? "character" : (item?.species || "Dragon");
        const glbUrl = customGlb || MESHY_MODEL_PATHS[targetKey];
        let companionHoverMesh = null;
        if (glbUrl && THREE.GLTFLoader) {
          fetch(glbUrl, { method: "HEAD" }).then(r => {
            if (!r.ok || cancelled) return;
            const loader = new THREE.GLTFLoader();
            loader.load(glbUrl, (gltf) => {
              if (cancelled) return;
              const model = gltf.scene;
              const box = new THREE.Box3().setFromObject(model);
              const size = box.getSize(new THREE.Vector3());
              const maxDim = Math.max(size.x, size.y, size.z) || 1;
              const scale = (mode === "character" ? 1.7 : 1.35) / maxDim;
              model.scale.setScalar(scale);
              const scaledBox = new THREE.Box3().setFromObject(model);
              const center = scaledBox.getCenter(new THREE.Vector3());
              model.position.x -= center.x;
              model.position.z -= center.z;
              model.position.y += (-0.84 - scaledBox.min.y);
              contentGroup.clear();
              contentGroup.add(model);
              if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                mixer.clipAction(gltf.animations[0]).play();
              }

              // Also load Active Familiar small beside Hero's shoulder in Character mode!
              if (mode === "character") {
                const activeFam = (player?.familiars || []).find(f => f.id === player?.equipped?.familiar);
                if (activeFam) {
                  const famUrl = MESHY_MODEL_PATHS[activeFam.species];
                  const addSmallFallbackFam = () => {
                    const fm = buildFamiliarMesh(THREE, activeFam);
                    fm.scale.setScalar(0.32);
                    fm.position.set(0.75, 0.35, 0.2);
                    companionHoverMesh = fm;
                    contentGroup.add(fm);
                  };
                  if (famUrl) {
                    fetch(famUrl, { method: "HEAD" }).then(fr => {
                      if (!fr.ok || cancelled) { if (!cancelled) addSmallFallbackFam(); return; }
                      loader.load(famUrl, (fGltf) => {
                        if (cancelled) return;
                        const fm = fGltf.scene;
                        const fb = new THREE.Box3().setFromObject(fm);
                        const fs = fb.getSize(new THREE.Vector3());
                        const fMax = Math.max(fs.x, fs.y, fs.z) || 1;
                        fm.scale.setScalar(0.42 / fMax);
                        const fc = new THREE.Box3().setFromObject(fm).getCenter(new THREE.Vector3());
                        fm.position.set(0.78 - fc.x, 0.35 - fc.y, 0.2 - fc.z);
                        companionHoverMesh = fm;
                        contentGroup.add(fm);
                      });
                    }).catch(() => { if (!cancelled) addSmallFallbackFam(); });
                  } else {
                    addSmallFallbackFam();
                  }
                }
              }
            });
          }).catch(() => {});
        }

        scene.add(rootGroup);
        let rafId = 0;
        const clock = new THREE.Clock();
        const animate = () => {
          rafId = requestAnimationFrame(animate);
          const dt = clock.getDelta();
          if (mixer) mixer.update(dt);
          if (companionHoverMesh) {
            companionHoverMesh.position.y = 0.35 + Math.sin(clock.elapsedTime * 2.4) * 0.08;
          }
          if (controls) controls.update();
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelled = true;
          cancelAnimationFrame(rafId);
          if (controls) controls.dispose();
          renderer.dispose();
        };
      }, [mode, customGlb, item?.id, item?.species, player?.equipped?.chest, player?.equipped?.head, player?.equipped?.weapon, player?.equipped?.familiar]);

      return <div ref={mountRef} style={{ height }} className="w-full rounded-xl bg-slate-950/90 border border-slate-800 overflow-hidden cursor-grab active:cursor-grabbing" />;
    }

    const WORLD_GLBS = {

    const MAZE_BIOMES = {

    const MAZE_DIFFICULTIES = {

    function generateRandomMaze(biomeKey = "grass", gridSize = 5) {
      const road = (MAZE_BIOMES[biomeKey] || MAZE_BIOMES.grass).roadKey;
      const g = Array.from({ length: gridSize }, () => Array(gridSize).fill("wall"));
      const visited = Array.from({ length: gridSize }, () => Array(gridSize).fill(false));
      const startX = Math.floor(gridSize / 2);
      const startY = gridSize - 1;
      const carve = (x, y) => {
        visited[y][x] = true;
        g[y][x] = road;
        const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]].sort(() => Math.random() - 0.5);
        for (const [dx, dy] of dirs) {
          const nx = x + dx * 2, ny = y + dy * 2;
          if (nx >= 0 && ny >= 0 && nx < gridSize && ny < gridSize && !visited[ny][nx]) {
            g[y + dy][x + dx] = road;
            carve(nx, ny);
          }
        }
      };
      carve(startX, startY);
      // Carve extra loops so multi-path corridors exist
      for (let y = 1; y < gridSize - 1; y += 2) {
        for (let x = 1; x < gridSize - 1; x += 2) {
          if (Math.random() < 0.35) g[y][x] = road;
        }
      }
      // Guarantee Escape Door tile near top center
      const escX = startX;
      const escY = 0;
      g[escY][escX] = "escape";
      if (g[1] && g[1][escX] === "wall") g[1][escX] = road;

      const candidates = [];
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (g[y][x] === road && !(x === startX && y === startY) && !(x === startX && y === startY - 1) && !(x === escX && y === escY)) {
            candidates.push([x, y]);
          }
        }
      }
      candidates.sort(() => Math.random() - 0.5);
      const numMonsters = gridSize >= 11 ? 5 : gridSize >= 9 ? 4 : gridSize >= 7 ? 3 : 2;
      const numChests = gridSize >= 9 ? 3 : gridSize >= 7 ? 2 : 1;
      let idx = 0;
      for (let i = 0; i < numMonsters && idx < candidates.length; i++, idx++) g[candidates[idx][1]][candidates[idx][0]] = "blocker";
      for (let i = 0; i < numChests && idx < candidates.length; i++, idx++) g[candidates[idx][1]][candidates[idx][0]] = "chest";
      if (candidates[idx]) { g[candidates[idx][1]][candidates[idx][0]] = "shop"; idx++; }
      // Randomly turn a pleasing mix of walls into Ancient Trees
      const treeChance = (biomeKey === "grass" || biomeKey === "water") ? 0.5 : (biomeKey === "stone" ? 0.35 : 0.22);
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (g[y][x] === "wall" && Math.random() < treeChance) {
            g[y][x] = "tree";
          }
        }
      }
      return g;
    }

    const INITIAL_WORLD_MAP = [
      ["tree",  "grass",  "escape",  "grass",   "tree"],
      ["grass", "wall",   "blocker", "tree",    "shop"],
      ["grass", "grass",  "blocker", "grass",   "grass"],
      ["tree",  "chest",  "grass",   "wall",    "tree"],
      ["tree",  "grass",  "grass",   "grass",   "tree"]
    ];

    function OverTheShoulderWorld({ activeZone, charSkinUrl, player, fighterId, getEquippedPowerBonus, getEquippedCardBuffs, onLootChest, onEncounterEnemy, onBuyShopItem, onUpdateHeroHp, onTrialDefeat }) {
      const cardBuffs = getEquippedCardBuffs ? getEquippedCardBuffs(player) : { bonusAp: 0, hpBonus: 0, critPct: 0, maxHp: 140, apPerTurn: 3, mythicCount: 0 };
      const heroCurHp = Math.min(cardBuffs.maxHp, player?.hp ?? cardBuffs.maxHp);
      const mountRef = React.useRef(null);
      const touchStartRef = React.useRef(null);
      const zoneMap = (activeZone && activeZone.map) ? activeZone.map : INITIAL_WORLD_MAP;
      const [biomeKey, setBiomeKey] = useState("grass");
      const [difficultyKey, setDifficultyKey] = useState("easy");
      const [floorNum, setFloorNum] = useState(1);
      const [mazeVersion, setMazeVersion] = useState(0);
      const [grid, setGrid] = useState(() => zoneMap.map(r => [...r]));
      const [pos, setPos] = useState({ x: 2, y: 4, dir: 0 }); // dir: 0=North(-Z), 1=East(+X), 2=South(+Z), 3=West(-X)
      const [worldMsg, setWorldMsg] = useState("Swipe on mobile or use Left / Forward / Right (A / W / D) to explore the Labyrinth!");
      const [mapExpanded, setMapExpanded] = useState(false);
      const [pendingEnemy, setPendingEnemy] = useState(null);
      const [shopOpen, setShopOpen] = useState(false);
      const [battleBusy, setBattleBusy] = useState(false);
      const [battleState, setBattleState] = useState(null);
      const [tasksDone, setTasksDone] = useState({ kills: 0, chests: 0 });
      const [revealedSet, setRevealedSet] = useState(() => new Set(["2,4", "2,3", "1,4", "3,4", "1,3", "3,3"]));
      const revealedRef = React.useRef(revealedSet);
      revealedRef.current = revealedSet;
      const [batPulses, setBatPulses] = useState(3);
      const [koPartyIds, setKoPartyIds] = useState([]);

      const diffCfg = MAZE_DIFFICULTIES[difficultyKey] || MAZE_DIFFICULTIES.easy;
      const pouchLevel = Math.max(1, Math.floor(((player?.pouchCapacity || 12) - 8) / 4));
      const satchelMaxPotions = Math.min(6, 1 + pouchLevel);
      const satchelMaxScrolls = Math.min(4, pouchLevel);
      const [satchel, setSatchel] = useState({ potions: 2, revealScrolls: 1, rallyScrolls: 1, teleports: 1 });

      const revealAround = (cx, cy, gSize) => {
        setRevealedSet(prev => {
          const next = new Set(prev);
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const rx = cx + dx, ry = cy + dy;
              if (rx >= 0 && ry >= 0 && rx < gSize && ry < gSize) next.add(`${rx},${ry}`);
            }
          }
          return next;
        });
      };

      const playerLevel = player?.level || 1;
      const maxPartySlots = playerLevel >= 40 ? 5 : playerLevel >= 20 ? 4 : 3;
      const availableRoster = [
        ...((player?.collection || []).map(m => ({ id: `m-${m.id}`, name: m.name, icon: "🐉", power: m.fusionPower || 65, kind: "Mandala" }))),
        ...((player?.familiars || []).map(f => ({ id: `f-${f.id}`, name: f.name, icon: "🐾", power: f.power || 55, kind: "Familiar" })))
      ];
      const [partyIds, setPartyIds] = useState(() => []);
      const effectiveParty = (() => {
        const picked = availableRoster.filter(u => partyIds.includes(u.id)).slice(0, maxPartySlots);
        if (picked.length > 0) return picked;
        if (availableRoster.length > 0) return [availableRoster[0]];
        return [{ id: "hero-solo", name: "MandalOz Hero", icon: "⚔️", power: 70, kind: "Hero" }];
      })();

      const togglePartyMember = (uid) => {
        setPartyIds(prev => {
          if (prev.includes(uid)) return prev.filter(id => id !== uid);
          if (prev.length >= maxPartySlots) return prev;
          return [...prev, uid];
        });
      };

      useEffect(() => {
        const nextMap = (activeZone && activeZone.map) ? activeZone.map : INITIAL_WORLD_MAP;
        if (activeZone?.biome && MAZE_BIOMES[activeZone.biome]) setBiomeKey(activeZone.biome);
        const sz = nextMap.length || 5;
        const sx = Math.floor(sz / 2), sy = sz - 1;
        setDifficultyKey("easy");
        setFloorNum(1);
        setGrid(nextMap.map(r => [...r]));
        setPos({ x: sx, y: sy, dir: 0 });
        setPendingEnemy(null);

      }, [activeZone?.id]);

      const rollNewMaze = (nextBiome = biomeKey, nextDiff = difficultyKey, nextFloor = 1) => {
        const dCfg = MAZE_DIFFICULTIES[nextDiff] || MAZE_DIFFICULTIES.easy;
        const nextMap = generateRandomMaze(nextBiome, dCfg.size);
        const sx = Math.floor(dCfg.size / 2), sy = dCfg.size - 1;
        setBiomeKey(nextBiome);
        setDifficultyKey(nextDiff);
        setFloorNum(nextFloor);
        setGrid(nextMap);
        setPos({ x: sx, y: sy, dir: 0 });
        setPendingEnemy(null);
        setShopOpen(false);
        setBattleState(null);
        setTasksDone({ kills: 0, chests: 0 });
        if (nextFloor === 1) {
          setKoPartyIds([]);
          setSatchel({
            potions: Math.min(satchelMaxPotions, 2),
            revealScrolls: Math.min(satchelMaxScrolls, 1),
            rallyScrolls: Math.min(satchelMaxScrolls, 1),
            teleports: 1
          });
        }
        setRevealedSet(new Set([`${sx},${sy}`, `${sx},${Math.max(0, sy - 1)}`, `${Math.max(0, sx - 1)},${sy}`, `${Math.min(dCfg.size - 1, sx + 1)},${sy}`]));
        setBatPulses(3);
        setMazeVersion(v => v + 1);
        setWorldMsg(`🎲 ${dCfg.label} Floor ${nextFloor}/${dCfg.floors} (${(MAZE_BIOMES[nextBiome] || MAZE_BIOMES.grass).label}) — Complete tasks to unlock 🚪 Escape Door!`);
      };

      const posRef = React.useRef(pos);
      const gridRef = React.useRef(grid);
      posRef.current = pos;
      gridRef.current = grid;

      const DIRS = [
        { dx: 0, dy: -1, label: "North", arrow: "▲", yaw: Math.PI },
        { dx: 1, dy: 0,  label: "East",  arrow: "▶", yaw: Math.PI / 2 },
        { dx: 0, dy: 1,  label: "South", arrow: "▼", yaw: 0 },
        { dx: -1, dy: 0, label: "West",  arrow: "◀", yaw: -Math.PI / 2 }
      ];

      const makeEnemyInfo = (nx, ny, isEscapeBoss = false) => {
        const mult = diffCfg.powerMult || 1.0;
        if (isEscapeBoss) {
          return {
            x: nx, y: ny, isEscapeBoss: true,
            name: `${(MAZE_BIOMES[biomeKey] || MAZE_BIOMES.grass).label.split(" ")[1]} Escape Warden (F${floorNum})`,
            power: Math.round((activeZone?.bossPower || 120) * mult * (1 + (floorNum - 1) * 0.25)),
            energyCost: activeZone?.energyCost || 1
          };
        }
        return {
          x: nx,
          y: ny,
          name: (ny <= 1 && activeZone?.bossName) ? activeZone.bossName : (activeZone?.guardName || (nx === 2 && ny === 2 ? "Stone Sentinel" : "Labyrinth Golem")),
          power: Math.round(((ny <= 1 && activeZone?.bossPower) ? activeZone.bossPower : (activeZone?.guardPower || (nx === 2 && ny === 2 ? 95 : 130))) * mult),
          energyCost: activeZone?.energyCost || 1
        };
      };

      const floorTasksComplete = tasksDone.kills >= diffCfg.reqKills && tasksDone.chests >= diffCfg.reqChests;

      const useBatPulse = () => {
        if (batPulses <= 0) {
          setWorldMsg("🦇 Maz Stinky Bat needs rest! (0 Bat Pulses left on this floor)");
          return;
        }
        const gSize = gridRef.current.length || 5;
        const cur = posRef.current;
        setRevealedSet(prev => {
          const next = new Set(prev);
          for (let dy = -2; dy <= 2; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
              const rx = cur.x + dx, ry = cur.y + dy;
              if (rx >= 0 && ry >= 0 && rx < gSize && ry < gSize) next.add(`${rx},${ry}`);
            }
          }
          return next;
        });
        setBatPulses(p => p - 1);
        setWorldMsg(`🦇 Maz Stinky Bat emitted a 5×5 Sonar Radar Pulse! Newly pinged tiles rendered (${batPulses - 1} left).`);
      };

      const useRevealScroll = () => {
        if (satchel.revealScrolls <= 0) { setWorldMsg("No Reveal Map Scrolls left in your Satchel!"); return; }
        const gSize = gridRef.current.length || 5;
        const all = new Set();
        for (let y = 0; y < gSize; y++) for (let x = 0; x < gSize; x++) all.add(`${x},${y}`);
        setRevealedSet(all);
        setSatchel(s => ({ ...s, revealScrolls: s.revealScrolls - 1 }));
        setWorldMsg("📜 Used Reveal Map Scroll! Entire Labyrinth floor & Escape Door revealed.");
      };

      const useRallyScroll = () => {
        if (satchel.rallyScrolls <= 0) { setWorldMsg("No Rally / Revive Scrolls left in your Satchel!"); return; }
        setKoPartyIds([]);
        setSatchel(s => ({ ...s, rallyScrolls: s.rallyScrolls - 1 }));
        setWorldMsg("📜 Used Rally Scroll! All party members revived and present for the Escape Boss!");
      };

      const useSatchelPotion = async () => {
        if (satchel.potions <= 0) { setWorldMsg("No Satchel Potions left!"); return; }
        setKoPartyIds([]);
        setSatchel(s => ({ ...s, potions: s.potions - 1 }));
        const healedHp = Math.min(cardBuffs.maxHp, heroCurHp + Math.round(cardBuffs.maxHp * 0.5));
        if (onUpdateHeroHp) await onUpdateHeroHp(healedHp);
        setWorldMsg(`🧪 Used Satchel Potion! Restored Hero HP to ${healedHp}/${cardBuffs.maxHp}.`);
      };

      const useTeleportSkill = () => {
        if (satchel.teleports <= 0) { setWorldMsg("✨ Teleport Skill already used on this floor!"); return; }
        const g = gridRef.current;
        const gSize = g.length || 5;
        let target = null;
        if (floorTasksComplete) {
          for (let y = 0; y < gSize; y++) for (let x = 0; x < gSize; x++) if (g[y][x] === "escape") target = { x, y: Math.min(gSize - 1, y + 1), label: "Escape Door" };
        }
        if (!target) {
          for (let y = 0; y < gSize; y++) for (let x = 0; x < gSize; x++) if (g[y][x] === "shop") target = { x, y: Math.min(gSize - 1, y + 1), label: "Merchant Shop" };
        }
        if (!target) target = { x: Math.floor(gSize / 2), y: gSize - 1, label: "Entrance" };
        setPos({ x: target.x, y: target.y, dir: 0 });
        revealAround(target.x, target.y, gSize);
        setSatchel(s => ({ ...s, teleports: s.teleports - 1 }));
        setWorldMsg(`✨ Cast Teleport Skill! Warped near ${target.label} (${target.x}, ${target.y}).`);

      const turnLeft = () => { setPendingEnemy(null); setShopOpen(false); setPos(p => ({ ...p, dir: (p.dir + 3) % 4 })); };
      const turnRight = () => { setPendingEnemy(null); setShopOpen(false); setPos(p => ({ ...p, dir: (p.dir + 1) % 4 })); };

      const moveForward = () => {
        setPendingEnemy(null);
        setShopOpen(false);
        const gSize = gridRef.current.length || 5;
        const cur = posRef.current;
        const d = DIRS[cur.dir];
        const nx = cur.x + d.dx;
        const ny = cur.y + d.dy;
        if (nx < 0 || ny < 0 || ny >= gSize || nx >= gSize) {
          setWorldMsg("Labyrinth Outer Wall! Turn Left or Right.");
          return;
        }
        const cell = gridRef.current[ny][nx];
        if (cell === "wall" || cell === "tree") {
          setWorldMsg(cell === "tree" ? "🌲 Ancient Forest Tree blocks the path! Turn Left or Right." : "Blocked by Labyrinth Wall! Turn Left or Right.");
          return;
        }
        if (cell === "blocker") {
          const enemy = makeEnemyInfo(nx, ny, false);
          setWorldMsg(`🗿 ${enemy.name} blocks the path! Prepare Battle to break through.`);

        }
        if (cell === "escape") {
          if (!floorTasksComplete) {
            setWorldMsg(`🚪 Escape Door LOCKED! Complete Floor Tasks first (${tasksDone.kills}/${diffCfg.reqKills} Kills, ${tasksDone.chests}/${diffCfg.reqChests} Chests).`);
            return;

          if (koPartyIds.length > 0) {

          const boss = makeEnemyInfo(nx, ny, true);

      };

      const interactAhead = async () => {
        const gSize = gridRef.current.length || 5;

        const ny = cur.y + d.dy;
        if (nx < 0 || ny < 0 || ny >= gSize || nx >= gSize) return;
        const cell = gridRef.current[ny][nx];
        if (cell === "chest") {
          const next = gridRef.current.map(r => [...r]);
          next[ny][nx] = (MAZE_BIOMES[biomeKey] || MAZE_BIOMES.grass).roadKey;
          setGrid(next);
          setTasksDone(t => ({ ...t, chests: t.chests + 1 }));
          setWorldMsg("📦 Opened Mystic Chest! Looted Materials & Shattered Ring Shards!");
          if (onLootChest) await onLootChest(activeZone);

          setShopOpen(true);
          setWorldMsg("🏪 Opened Labyrinth Merchant Shop!");
        } else if (cell === "escape") {
          if (!floorTasksComplete) {
            setWorldMsg(`🚪 Escape Door LOCKED! Tasks: ${tasksDone.kills}/${diffCfg.reqKills} Kills, ${tasksDone.chests}/${diffCfg.reqChests} Chests.`);
            return;
          }
          if (koPartyIds.length > 0) {
            setWorldMsg("⚠️ All party members must be present! Use a 📜 Rally Scroll before fighting the Escape Boss.");
            return;
          }
          setPendingEnemy(makeEnemyInfo(nx, ny, true));
          setWorldMsg("⚔️ Escape Boss Battle Prepared!");
        } else if (cell === "blocker") {
          setPendingEnemy(makeEnemyInfo(nx, ny, false));
          setWorldMsg("⚔️ Battle Prepared! Review your Party & Launch Battle.");
        } else {
          setWorldMsg("Nothing to interact with directly ahead.");
        }
      };

      const startTurnBasedBattle = () => {
        if (!pendingEnemy || battleBusy) return;
        const gearBonus = getEquippedPowerBonus ? getEquippedPowerBonus(player) : 0;
        const activeAllies = effectiveParty.filter(u => !koPartyIds.includes(u.id));
        if (activeAllies.length === 0) {
          setWorldMsg("⚠️ All party members are KO'd! Use a 📜 Rally Scroll or 🧪 Satchel Potion first.");
          return;
        }
        const partyUnits = activeAllies.map((u, idx) => {
          const baseMax = 90 + Math.round((u.power || 60) * 0.8) + playerLevel * 12 + (idx === 0 ? cardBuffs.hpBonus : Math.round(cardBuffs.hpBonus * 0.4));
          const maxHp = idx === 0 ? Math.max(baseMax, cardBuffs.maxHp) : baseMax;
          const startHp = idx === 0 ? Math.max(1, Math.min(maxHp, heroCurHp)) : maxHp;
          const atk = 22 + Math.round((u.power || 60) * 0.45) + Math.round((idx === 0 ? gearBonus : gearBonus * 0.35)) + playerLevel * 3;
          return { ...u, hp: startHp, maxHp, atk, ap: cardBuffs.apPerTurn, maxAp: cardBuffs.apPerTurn, critPct: cardBuffs.critPct, guard: false };
        });
        const enemyMaxHp = Math.max(140, Math.round(pendingEnemy.power * 2.1));
        const enemyAtk = Math.max(18, Math.round(pendingEnemy.power * 0.32));
        setBattleState({
          enemyInfo: pendingEnemy,
          enemy: { name: pendingEnemy.name, hp: enemyMaxHp, maxHp: enemyMaxHp, atk: enemyAtk },
          party: partyUnits,
          activeIdx: 0,
          round: 1,
          log: `⚔️ Round 1: ${partyUnits.length}-member party (${cardBuffs.apPerTurn} AP/turn, ${cardBuffs.critPct}% Crit) vs ${pendingEnemy.name}!`
        });
      };

      const resolveVictory = async (enemyInfo, fallenIds = [], survivingLeaderHp = null) => {
        setBattleBusy(true);
        try {
          if (fallenIds.length > 0) setKoPartyIds(prev => [...new Set([...prev, ...fallenIds])]);
          if (survivingLeaderHp != null && onUpdateHeroHp) await onUpdateHeroHp(survivingLeaderHp);
          const result = onEncounterEnemy ? await onEncounterEnemy({ ...enemyInfo, tacticalVictory: true }) : { win: true, msg: "Victory!" };
          if (result?.win !== false) {
            if (enemyInfo.isEscapeBoss) {
              if (floorNum < diffCfg.floors) {
                rollNewMaze(biomeKey, difficultyKey, floorNum + 1);
                setWorldMsg(`🚪 Defeated ${enemyInfo.name}! Advancing to Floor ${floorNum + 1}/${diffCfg.floors}!`);
                return;
              }
              setPendingEnemy(null);
              setBattleState(null);
              setWorldMsg(`🏆 ESCAPED ${diffCfg.label}! Defeated ${enemyInfo.name} and cleared the Trial!`);
              return;
            }
            const next = gridRef.current.map(r => [...r]);
            next[enemyInfo.y][enemyInfo.x] = (MAZE_BIOMES[biomeKey] || MAZE_BIOMES.grass).roadKey;
            setGrid(next);
            setTasksDone(t => ({ ...t, kills: t.kills + 1 }));
            setPendingEnemy(null);
            setBattleState(null);
            setWorldMsg(result?.msg || `⚔️ Victory vs ${enemyInfo.name}! Path is now open.`);
          } else {
            setBattleState(null);
            setWorldMsg(result?.msg || "Battle ended.");
          }
        } finally {
          setBattleBusy(false);
        }
      };

      const useCombatSkill = async (skillType) => {
        if (!battleState || battleBusy) return;
        const { party, enemy, activeIdx, round, enemyInfo } = battleState;
        const unit = party[activeIdx];
        if (!unit || unit.hp <= 0) return;
        if (skillType === "potion") {
          if (satchel.potions <= 0) {
            setBattleState(s => ({ ...s, log: "No Satchel Potions left! Buy more at 🏪 Shop." }));
            return;
          }
          const heal = Math.round(unit.maxHp * 0.5);
          const nextParty = party.map((u, i) => i === activeIdx ? { ...u, hp: Math.min(u.maxHp, u.hp + heal) } : u);
          setSatchel(s => ({ ...s, potions: s.potions - 1 }));
          setBattleState({ ...battleState, party: nextParty, log: `🧪 Used Satchel Potion (0 AP)! ${unit.name} healed +${heal} HP!` });
          return;
        }
        const cost = skillType === "burst" ? 2 : 1;
        if (unit.ap < cost) {
          setBattleState(s => ({ ...s, log: `${unit.name} needs ${cost} AP! Select another ally or End Turn.` }));
          return;
        }
        const nextParty = party.map((u, i) => i === activeIdx ? { ...u, ap: u.ap - cost } : { ...u });
        let nextEnemyHp = enemy.hp;
        let msg = "";
        if (skillType === "strike" || skillType === "burst") {
          const mult = skillType === "burst" ? 1.75 : 1.0;
          const isCrit = Math.random() * 100 < (unit.critPct || 0);
          const dmg = Math.round(unit.atk * mult * (isCrit ? 1.5 : 1.0) * (0.9 + Math.random() * 0.25));
          nextEnemyHp = Math.max(0, enemy.hp - dmg);
          msg = `${unit.icon} ${unit.name} used ${skillType === "burst" ? "🔥 Element Burst" : "⚔️ Strike"}${isCrit ? " 💥 CRIT!" : ""} for ${dmg} DMG!`;
        } else {
          const heal = Math.round(unit.maxHp * 0.25);
          nextParty[activeIdx].hp = Math.min(unit.maxHp, unit.hp + heal);
          nextParty[activeIdx].guard = true;
          msg = `${unit.icon} ${unit.name} Guarded (+${heal} HP, 40% DMG reduction)!`;
        }
        if (nextEnemyHp <= 0) {
          const fallen = nextParty.filter(u => u.hp <= 0).map(u => u.id);
          const leaderHp = nextParty[0]?.hp ?? heroCurHp;
          setBattleState(s => ({ ...s, enemy: { ...s.enemy, hp: 0 }, party: nextParty, log: `🎉 ${enemy.name} defeated!` }));
          await resolveVictory(enemyInfo, fallen, leaderHp);
          return;
        }
        let nextIdx = activeIdx;
        if (nextParty[activeIdx].ap <= 0) {
          const another = nextParty.findIndex(u => u.hp > 0 && u.ap > 0);
          if (another >= 0) nextIdx = another;
        }
        setBattleState({ ...battleState, party: nextParty, enemy: { ...enemy, hp: nextEnemyHp }, activeIdx: nextIdx, log: msg });
      };

      const endPlayerTurn = async () => {
        if (!battleState || battleBusy) return;
        const { party, enemy, round } = battleState;
        const livingIndices = party.map((u, i) => u.hp > 0 ? i : -1).filter(i => i >= 0);
        if (livingIndices.length === 0) {
          setBattleState(null);
          setPendingEnemy(null);
          if (onTrialDefeat) await onTrialDefeat();
          setWorldMsg("💀 TRIAL WIPE! All equipped gear & ability NFTs brought into the Trial were lost!");
          return;
        }
        const targetIdx = livingIndices[Math.floor(Math.random() * livingIndices.length)];
        const target = party[targetIdx];
        const rawDmg = Math.round(enemy.atk * (0.85 + Math.random() * 0.3));
        const dmg = target.guard ? Math.round(rawDmg * 0.6) : rawDmg;
        const nextParty = party.map((u, i) => ({
          ...u,
          hp: i === targetIdx ? Math.max(0, u.hp - dmg) : u.hp,
          ap: u.hp > 0 ? u.maxAp : 0,
          guard: false
        }));
        const stillAlive = nextParty.findIndex(u => u.hp > 0);
        if (stillAlive < 0) {
          setBattleState(null);
          setPendingEnemy(null);
          if (onTrialDefeat) await onTrialDefeat();
          setWorldMsg(`💀 TRIAL WIPE! ${enemy.name} defeated your party — equipped gear & ability NFTs were lost!`);
          return;
        }
        setBattleState({
          ...battleState,
          party: nextParty,
          activeIdx: stillAlive,
          round: round + 1,
          log: `🗿 ${enemy.name} struck ${target.name} for ${dmg} DMG! Round ${round + 1} begins (AP refreshed).`
        });
      };

      const handleTouchStart = (e) => {
        if (!e.touches || !e.touches[0]) return;
        touchStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      };

      const handleTouchEnd = (e) => {
        if (!touchStartRef.current || !e.changedTouches || !e.changedTouches[0]) return;
        const dx = e.changedTouches[0].clientX - touchStartRef.current.x;
        const dy = e.changedTouches[0].clientY - touchStartRef.current.y;
        touchStartRef.current = null;
        if (Math.abs(dx) < 24 && Math.abs(dy) < 24) {
          interactAhead();
          return;
        }
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) turnLeft(); else turnRight();
        } else {
          if (dy < 0) moveForward(); else interactAhead();
        }
      };

      useEffect(() => {
        const onKey = (e) => {
          if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
          if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") turnLeft();
          else if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") turnRight();
          else if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") moveForward();
          else if (e.key === " ") { e.preventDefault(); interactAhead(); }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      useEffect(() => {
        const el = mountRef.current;
        if (!el || !window.THREE) return;
        const THREE = window.THREE;
        let renderer;
        try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch { return; }
        const w = el.clientWidth || 560;
        const h = el.clientHeight || 340;
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        el.innerHTML = "";
        el.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060b16);
        scene.fog = new THREE.FogExp2(0x060b16, 0.055);

        const camera = new THREE.PerspectiveCamera(58, w / h, 0.1, 80);
        scene.add(new THREE.HemisphereLight(0xdbeafe, 0x0f172a, 0.9));
        const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.3);
        dirLight.position.set(6, 12, 8);
        scene.add(dirLight);

        const TILE = 3.2;
        const loader = THREE.GLTFLoader ? new THREE.GLTFLoader() : null;
        const cache = {};
        const loadGlbOnce = (url, targetHeight, cb, flatTile = false) => {
          if (!loader || !url) return;
          const cacheKey = `${url}::${flatTile ? "flat" : "upright"}`;
          if (cache[cacheKey]) { cb(cache[cacheKey].clone()); return; }
          loader.load(url, (gltf) => {
            const m = gltf.scene;
            const rawBox = new THREE.Box3().setFromObject(m);
            const rawSz = rawBox.getSize(new THREE.Vector3());
            // If a tile model was exported standing upright (tall Y, thin Z), lay it flat instead of scrunching it
            if (flatTile && rawSz.y > rawSz.z * 1.35 && rawSz.y > rawSz.x * 0.6) {
              m.rotation.x = -Math.PI / 2;
            }
            const box = new THREE.Box3().setFromObject(m);
            const sz = box.getSize(new THREE.Vector3());
            const sc = flatTile
              ? (targetHeight / (Math.max(sz.x, sz.z) || 1))
              : (targetHeight / (Math.max(sz.x, sz.y, sz.z) || 1));
            m.scale.setScalar(sc);
            if (flatTile) {
              const scaledBox = new THREE.Box3().setFromObject(m);
              const scaledSz = scaledBox.getSize(new THREE.Vector3());
              if (scaledSz.y > 0.55) {
                m.scale.y *= (0.45 / scaledSz.y);
              }
            }
            const sb = new THREE.Box3().setFromObject(m);
            const c = sb.getCenter(new THREE.Vector3());
            m.position.set(-c.x, flatTile ? -sb.max.y + 0.04 : -sb.min.y, -c.z);
            const wrapper = new THREE.Group();
            wrapper.add(m);
            cache[cacheKey] = wrapper;
            cb(wrapper.clone());
          }, undefined, () => {});
        };

        const propsGroup = new THREE.Group();
        scene.add(propsGroup);

        const biomeCfg = MAZE_BIOMES[biomeKey] || MAZE_BIOMES.grass;
        const TILE_COLORS = { grass: 0x15803d, lava: 0xc2410c, stone: 0x475569, fire: 0xc2410c, water: 0x0369a1, ice: 0x38bdf8, electric: 0x7e22ce, escape: 0x10b981, wall: biomeCfg.wallColor };
        const renderedTiles = {};
        const spawnRevealedTile = (gx, gy, cell, curSize) => {
          const tKey = `${gx},${gy}`;
          if (renderedTiles[tKey]) return;
          renderedTiles[tKey] = true;
          const curHalf = Math.floor(curSize / 2);
          const wx = (gx - curHalf) * TILE;
          const wz = (gy - curHalf) * TILE;
          const floorKey = (cell === "chest" || cell === "blocker" || cell === "shop" || cell === "escape" || cell === "tree") ? biomeCfg.roadKey : cell;
          const tCol = TILE_COLORS[floorKey] || biomeCfg.roadColor || 0x334155;
          const baseTile = new THREE.Mesh(new THREE.BoxGeometry(TILE * 0.96, 0.25, TILE * 0.96), new THREE.MeshStandardMaterial({ color: tCol, roughness: 0.6 }));
          baseTile.position.set(wx, -0.125, wz);
          scene.add(baseTile);
          if (cell !== "wall" && WORLD_GLBS[floorKey]) {
            loadGlbOnce(WORLD_GLBS[floorKey], TILE * 0.96, (obj) => {
              obj.position.set(wx, 0, wz);
              scene.add(obj);
            }, true);
          }
          if (cell === "tree") {
            if (Math.random() < 0.35 && WORLD_GLBS.tree) {
              loadGlbOnce(WORLD_GLBS.tree, TILE * 1.05, (obj) => {
                obj.rotation.y = Math.random() * Math.PI * 2;
                obj.position.set(wx, -0.02, wz);
                scene.add(obj);
              }, false);
            } else {
              const treeGroup = new THREE.Group();
              const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.36, 1.3, 8), new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 }));
              trunk.position.y = 0.65;
              treeGroup.add(trunk);
              const leafColor = biomeKey === "fire" ? 0x9a3412 : biomeKey === "electric" ? 0x4c1d95 : biomeKey === "water" ? 0x0f766e : 0x15803d;
              [[1.25, 1.4, 1.45], [0.95, 1.25, 2.15], [0.65, 1.05, 2.75]].forEach(([r, h, py]) => {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), new THREE.MeshStandardMaterial({ color: leafColor, roughness: 0.75 }));
                cone.position.y = py;
                treeGroup.add(cone);
              });
              treeGroup.scale.setScalar(0.9 + Math.random() * 0.28);
              treeGroup.rotation.y = Math.random() * Math.PI * 2;
              treeGroup.position.set(wx, 0, wz);
              scene.add(treeGroup);
            }
          }
          if (cell === "wall") {
            if (biomeCfg.wallGlb) {
              loadGlbOnce(biomeCfg.wallGlb, TILE * 0.96, (obj) => {
                obj.position.set(wx, -0.02, wz);
                scene.add(obj);
              }, false);
            } else {
              // Clean 3D Stone Ruin Pillar Wall with mossy/trimmed cap
              const ruin = new THREE.Group();
              const body = new THREE.Mesh(new THREE.BoxGeometry(TILE * 0.88, 2.5, TILE * 0.88), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.85 }));
              body.position.y = 1.25;
              ruin.add(body);
              const cap = new THREE.Mesh(new THREE.BoxGeometry(TILE * 0.96, 0.28, TILE * 0.96), new THREE.MeshStandardMaterial({ color: biomeKey === "grass" ? 0x166534 : 0x475569, roughness: 0.75 }));
              cap.position.y = 2.6;
              ruin.add(cap);
              ruin.position.set(wx, 0, wz);
              scene.add(ruin);
            }
          }
        };

        const heroGroup = new THREE.Group();
        const fallbackHero = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.5, 12), new THREE.MeshStandardMaterial({ color: 0x6366f1 }));
        fallbackHero.position.y = 0.75;
        heroGroup.add(fallbackHero);
        loadGlbOnce(charSkinUrl || "/models/character.glb", 1.7, (obj) => {
          heroGroup.clear();
          heroGroup.add(obj);
        });
        scene.add(heroGroup);

        let cancelled = false;
        let rafId = 0;
        const dynamicMeshes = {};
        const syncProps = () => {
          const g = gridRef.current;
          const rev = revealedRef.current;
          const curSize = g.length || 5;
          const curHalf = Math.floor(curSize / 2);
          for (let gy = 0; gy < curSize; gy++) {
            for (let gx = 0; gx < curSize; gx++) {
              const key = `${gx},${gy}`;
              if (!rev.has(key)) continue; // Fog of War: don't render 3D tiles/props until revealed!
              const cell = g[gy][gx];
              spawnRevealedTile(gx, gy, cell, curSize);
              if ((cell === "chest" || cell === "blocker" || cell === "shop" || cell === "escape") && !dynamicMeshes[key]) {
                const holder = new THREE.Group();
                holder.position.set((gx - curHalf) * TILE, 0, (gy - curHalf) * TILE);
                if (cell === "escape") {
                  const arch = new THREE.Mesh(
                    new THREE.BoxGeometry(1.7, 2.5, 0.4),
                    new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x065f46, roughness: 0.3 })
                  );
                  arch.position.y = 1.25;
                  holder.add(arch);
                } else {
                  const ph = new THREE.Mesh(
                    cell === "chest" ? new THREE.BoxGeometry(0.9, 0.7, 0.7) : cell === "shop" ? new THREE.CylinderGeometry(0.45, 0.55, 1.2, 10) : new THREE.ConeGeometry(0.65, 1.8, 8),
                    new THREE.MeshStandardMaterial({ color: cell === "chest" ? 0xf59e0b : cell === "shop" ? 0x10b981 : 0xef4444 })
                  );
                  ph.position.y = cell === "chest" ? 0.35 : 0.7;
                  holder.add(ph);
                  loadGlbOnce(WORLD_GLBS[cell], cell === "chest" ? 1.0 : cell === "shop" ? 1.35 : 1.9, (obj) => {
                    holder.clear();
                    holder.add(obj);
                  });
                }
                propsGroup.add(holder);
                dynamicMeshes[key] = holder;
              } else if (cell !== "chest" && cell !== "blocker" && cell !== "shop" && cell !== "escape" && dynamicMeshes[key]) {
                propsGroup.remove(dynamicMeshes[key]);
                delete dynamicMeshes[key];
              }
            }
          }
        };

        const animate = () => {
          if (cancelled) return;
          rafId = requestAnimationFrame(animate);
          syncProps();
          const cur = posRef.current;
          const d = DIRS[cur.dir];
          const curHalf = Math.floor((gridRef.current.length || 5) / 2);
          const tx = (cur.x - curHalf) * TILE;
          const tz = (cur.y - curHalf) * TILE;
          heroGroup.position.x += (tx - heroGroup.position.x) * 0.18;
          heroGroup.position.z += (tz - heroGroup.position.z) * 0.18;
          heroGroup.rotation.y = d.yaw;

          // Over-the-shoulder camera slightly behind & right of Hero
          const rightX = -d.dy;
          const rightZ = d.dx;
          const camTargetX = heroGroup.position.x - d.dx * 3.1 + rightX * 0.65;
          const camTargetZ = heroGroup.position.z - d.dy * 3.1 + rightZ * 0.65;
          camera.position.x += (camTargetX - camera.position.x) * 0.14;
          camera.position.z += (camTargetZ - camera.position.z) * 0.14;
          camera.position.y = 2.25;
          camera.lookAt(heroGroup.position.x + d.dx * 3.5, 1.05, heroGroup.position.z + d.dy * 3.5);
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelled = true;
          cancelAnimationFrame(rafId);
          renderer.dispose();
        };
      }, [charSkinUrl, activeZone?.id, mazeVersion]);

      const dInfo = DIRS[pos.dir];
      const gridSize = grid.length || 5;
      const aheadX = pos.x + dInfo.dx;
      const aheadY = pos.y + dInfo.dy;
      const aheadCell = (aheadX >= 0 && aheadY >= 0 && aheadX < gridSize && aheadY < gridSize) ? grid[aheadY][aheadX] : "edge";

      const activeFighter = (player?.collection || []).find(m => m.id === fighterId) || (player?.collection || [])[0];
      const estPower = (activeFighter?.fusionPower || 60) + (player?.level || 1) * 15 + (getEquippedPowerBonus ? getEquippedPowerBonus(player) : 0) + (player?.battleBoost || 0);

      return (
        <div className="bg-slate-900 border border-emerald-500/40 rounded-2xl p-4 sm:p-5 space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 className="text-base font-black text-white">{activeZone?.title || `🏰 The Labyrinth — Floor ${floorNum}/${diffCfg.floors} (${diffCfg.size}×${diffCfg.size})`}</h2>
              <p className="text-xs text-slate-400">{activeZone?.subtitle || "Swipe on mobile or use A / W / D. Complete floor tasks & gather all party members for the Escape Boss!"}</p>
            </div>
            <span className="px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-800 text-xs font-bold text-emerald-300">
              Facing: {dInfo.arrow} {dInfo.label} ({pos.x}, {pos.y})
            </span>
          </div>

          {/* Difficulty Tier & Floor Tasks Bar */}
          <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-950/70 border border-slate-800 rounded-xl p-2">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-[11px] font-bold text-slate-400 px-1">Difficulty:</span>
              {Object.entries(MAZE_DIFFICULTIES).map(([dKey, dItem]) => (
                <button
                  key={dKey}
                  type="button"
                  onClick={() => rollNewMaze(biomeKey, dKey, 1)}
                  className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${difficultyKey === dKey ? "bg-rose-600 text-white" : "bg-slate-800 hover:bg-slate-700 text-slate-300"}`}
                >
                  {dItem.label}
                </button>
              ))}
            </div>
            <div className="flex flex-wrap items-center gap-2 text-[11px] font-bold">
              <span className="px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-amber-300">
                Kills: {tasksDone.kills}/{diffCfg.reqKills} • Chests: {tasksDone.chests}/{diffCfg.reqChests}
              </span>
              <span className={`px-2 py-0.5 rounded border ${floorTasksComplete ? "bg-emerald-950 border-emerald-500 text-emerald-300" : "bg-slate-900 border-slate-700 text-slate-400"}`}>
                {floorTasksComplete ? "🚪 Escape Open!" : "🔒 Escape Locked"}
              </span>
            </div>
          </div>

          {/* Elemental Road & Random Maze Generator Bar */}
          <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-950/70 border border-slate-800 rounded-xl p-2">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-[11px] font-bold text-slate-400 px-1">Road Element:</span>
              {Object.entries(MAZE_BIOMES).map(([bKey, bCfg]) => (
                <button
                  key={bKey}
                  type="button"
                  onClick={() => rollNewMaze(bKey, difficultyKey, floorNum)}
                  className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${biomeKey === bKey ? "bg-emerald-600 text-white" : "bg-slate-800 hover:bg-slate-700 text-slate-300"}`}
                >
                  {bCfg.label}
                </button>
              ))}
            </div>
            <button
              type="button"
              onClick={() => rollNewMaze(biomeKey, difficultyKey, floorNum)}
              className="px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-[11px] font-black text-white"
            >
              🎲 New Random Maze
            </button>
          </div>

          {/* Satchel Loadout, Scrolls & Teleport Bar */}

      const getEquippedPowerBonus = (p) => {
        if (!p) return 0;
        const eq = p.equipped || {};
        let total = 0;
        const ab = (p.abilities || []).find(a => a.id === eq.ability);
        if (ab) total += (ab.powerBonus || 0);
        ["head", "chest", "boots", "weapon"].forEach(slot => {
          const g = (p.gear || []).find(x => x.id === eq[slot]);
          if (g) total += (g.powerBonus || 0);
        });
        const wpn = (p.gear || []).find(x => x.id === eq.weapon);
        const qv = (p.consumables || []).find(x => x.id === eq.quiver && (x.qty || 0) > 0);
        if (wpn?.weaponKind === "bow" && qv) total += (qv.powerBonus || 0);
        const fam = (p.familiars || []).find(f => f.id === eq.familiar);
        if (fam) total += (fam.powerBonus || 0);
        return total;
      };

      const getEquippedCardBuffs = (p) => {
        if (!p) return { bonusAp: 0, hpBonus: 0, critPct: 0, maxHp: 140, apPerTurn: 3, mythicCount: 0 };
        const eq = p.equipped || {};
        const equippedItems = [
          (p.collection || []).find(m => m.id === (eq.mandala || fighterId)),
          (p.abilities || []).find(a => a.id === eq.ability),
          (p.gear || []).find(g => g.id === eq.head),
          (p.gear || []).find(g => g.id === eq.chest),
          (p.gear || []).find(g => g.id === eq.weapon),
          (p.familiars || []).find(f => f.id === eq.familiar),
          (p.mounts || []).find(m => m.id === eq.mount)
        ].filter(Boolean);
        let bonusAp = 0, hpBonus = 0, critPct = 0, mythicCount = 0;
        equippedItems.forEach(item => {
          const r = (item.rarity || "common").toLowerCase();
          if (r === "mythic") { bonusAp += 2; hpBonus += 35; critPct += 20; mythicCount += 1; }
          else if (r === "legendary") { bonusAp += 1; hpBonus += 22; critPct += 12; }
          else if (r === "epic") { bonusAp += 1; hpBonus += 15; critPct += 8; }
          else if (r === "rare") { hpBonus += 10; critPct += 4; }
        });
        bonusAp = Math.min(6, bonusAp);
        const maxHp = 120 + (p.level || 1) * 20 + hpBonus;
        return { bonusAp, hpBonus, critPct: Math.min(75, critPct), maxHp, apPerTurn: 3 + bonusAp, mythicCount };
