          return;
        }
        const nextEggs = (player.eggs || []).filter(e => e.id !== egg.id);
        await savePlayerProfile({ ...player, rings: nextRings, eggs: nextEggs });
        setChainStatus(`🥚 Placed ${egg.name} onto your Familiar Ring! Walk it by harvesting Realms, Battling, or running Trials (0/5 steps).`);
      };

      const hatchWalkedEgg = async (ringIdx, slotIdx) => {
        if (!player) return;
        const curRings = [...(player.rings || [])];
        const slot = curRings[ringIdx]?.bound?.[slotIdx];
        if (!slot || slot.type !== "walkingEgg" || (slot.steps || 0) < (slot.maxSteps || 5)) return;
        setBusy(true);
        try {
          const spec = FAMILIAR_SPECIES[slot.species] || FAMILIAR_SPECIES.Bat;
          const { element, isRareElement } = rollSpeciesElement(slot.species);
          const isAlpha = slot.isDenEgg ? Math.random() < 0.40 : Math.random() < 0.12;
          const alphaBoost = isAlpha ? 1.35 : 1;
          const famNft = {
            id: Date.now() + Math.floor(Math.random() * 999),
            category: "familiar",
            species: slot.species,
            icon: spec.icon,
            name: `${isAlpha ? "👑 Alpha " : ""}${element[0].toUpperCase() + element.slice(1)} ${slot.species}`,
            elements: [element],
            isRareElement,
            isAlpha,
            rarity: isAlpha ? "legendary" : (isRareElement ? "epic" : slot.rarity),
            tier: spec.floor + (isAlpha ? 1 : 0),
            powerBonus: Math.round((spec.basePower + (isRareElement ? 18 : 0)) * alphaBoost),
            marketValue: Math.round((spec.basePower + 15) * 2 * (isAlpha ? 1.8 : 1))
          };
          const res = await fetch("/api/mandaloz/nft/mint", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ address: walletAddress, action: "WALKED_EGG_HATCH", nft: famNft, costCrow: 0 })
          }).then(r => r.json());
          if (!res?.ok) { setChainStatus(res?.error || "Hatch failed."); return; }
          const minted = res.nft || famNft;
          curRings[ringIdx] = { ...curRings[ringIdx], bound: curRings[ringIdx].bound.map((s, i) => i === slotIdx ? null : s) };
          await savePlayerProfile({
            ...player,
            rings: curRings,
            familiars: [...(player.familiars || []), minted],
            equipped: { ...(player.equipped || {}), familiar: player.equipped?.familiar || minted.id }
          });
          setChainStatus(`🐣 Walked Egg hatched into ${minted.icon} ${minted.name}! • Block #${res.block?.block_number || "?"}`);
          await refreshChain(walletAddress);
        } finally {
          setBusy(false);
        }
      };

      const startFamiliarBattle = () => {
        if (!player) return;
        const activeFam = (player.familiars || []).find(f => f.id === player.equipped?.familiar) || (player.familiars || [])[0];
        if (!activeFam) {
          setChainStatus("Capture or hatch a Familiar first before entering Familiar Battles!");
          return;
        }
        const pStats = getFamiliarStats(activeFam);
        const spList = Object.keys(FAMILIAR_SPECIES);
        const eSp = spList[Math.floor(Math.random() * spList.length)];
        const eSpec = FAMILIAR_SPECIES[eSp];
        const { element: eEl, isRareElement } = rollSpeciesElement(eSp);
        const eLv = Math.max(1, pStats.famLevel + Math.floor(Math.random() * 3) - 1);
        const enemy = {
          id: Date.now(),
          species: eSp,
          icon: eSpec.icon,
          elements: [eEl],
          isAlpha: isRareElement && Math.random() < 0.25,
          name: `Wild ${eEl[0].toUpperCase() + eEl.slice(1)} ${eSp}`,
          famLevel: eLv,
          maxHp: 50 + eSpec.basePower + eLv * 11,
          atk: 12 + Math.round(eSpec.basePower * 0.45) + eLv * 3,
          def: 8 + Math.round(eSpec.basePower * 0.3) + eLv * 2
        };
        setFamBattle({
          activeFamId: activeFam.id,
          playerHp: pStats.maxHp,
          playerMaxHp: pStats.maxHp,
          enemy,
          enemyHp: enemy.maxHp,
          enemyMaxHp: enemy.maxHp,
          finished: false,
          log: `A wild ${enemy.icon} ${enemy.name} (Lv.${enemy.famLevel}) appeared!`
        });
      };

      const useFamiliarMove = async (move) => {
        if (!famBattle || famBattle.finished || !player) return;
        const activeFam = (player.familiars || []).find(f => f.id === famBattle.activeFamId);
        if (!activeFam) return;
        const pStats = getFamiliarStats(activeFam);
        const enemy = famBattle.enemy;
        const eEl = enemy.elements[0] || "earth";

        let mult = 1;
        let effNote = "";
        if (move.element !== "neutral") {
          const adv = ELEMENT_ADVANTAGE[move.element];
          if (adv?.strong?.includes(eEl)) { mult = 1.5; effNote = " (SUPER EFFECTIVE!)"; }
          else if (adv?.weak?.includes(eEl)) { mult = 0.75; effNote = " (Not very effective)"; }
        }
        const rawDmg = Math.max(6, Math.round((pStats.atk + move.power - enemy.def * 0.45) * mult * (0.9 + Math.random() * 0.2)));
        const nextEnemyHp = Math.max(0, famBattle.enemyHp - rawDmg);

        if (nextEnemyHp <= 0) {
          const xpGain = 35 + enemy.famLevel * 10;
          const prevLv = pStats.famLevel;
          const nextFamXp = (activeFam.famXp || 0) + xpGain;
          const newStats = getFamiliarStats({ ...activeFam, famXp: nextFamXp });
          const leveledUp = newStats.famLevel > prevLv;
          const nextFams = (player.familiars || []).map(f => f.id === activeFam.id ? {
            ...f,
            famXp: nextFamXp,
            famLevel: newStats.famLevel,
            powerBonus: (f.powerBonus || 22) + (leveledUp ? 4 * (newStats.famLevel - prevLv) : 0)
          } : f);
          await savePlayerProfile({
            ...player,
            familiars: nextFams,
            ringShards: (player.ringShards || 0) + 1
          });
          setFamBattle({
            ...famBattle,
            enemyHp: 0,
            finished: true,
            log: `${activeFam.name} used ${move.name} for ${rawDmg} dmg${effNote}! Victory! +${xpGain} Fam XP, +1 Ring Shard${leveledUp ? ` • 🎉 LEVEL UP -> Lv.${newStats.famLevel}!` : ""}`
          });
          return;
        }

        // Enemy turn
        const eDmg = Math.max(4, Math.round((enemy.atk + 16 - pStats.def * 0.45) * (0.85 + Math.random() * 0.25)));
        const nextPlayerHp = Math.max(0, famBattle.playerHp - eDmg);
        setFamBattle({
          ...famBattle,
          enemyHp: nextEnemyHp,
          playerHp: nextPlayerHp,
          finished: nextPlayerHp <= 0,
          log: `${activeFam.name} used ${move.name} (-${rawDmg} HP${effNote}). ${enemy.name} countered for -${eDmg} HP!${nextPlayerHp <= 0 ? " Your Familiar fainted!" : ""}`
        });
      };

      const combineSameBreedFamiliars = async () => {
        if (!player || !famPickA || !famPickB || famPickA === famPickB) {
          setChainStatus("Select 2 different Familiars of the SAME species to combine.");
          return;
        }
        const f1 = (player.familiars || []).find(f => f.id === famPickA);
        const f2 = (player.familiars || []).find(f => f.id === famPickB);
        if (!f1 || !f2) return;
        if (f1.species !== f2.species) {
          setChainStatus(`Must combine the SAME breed! (${f1.species} cannot combine with ${f2.species})`);
          return;
        }
        if ((player.materials?.essence || 0) < 2 || liveCrow < 45) {
          setChainStatus("Need 45 CROW + 2 Arcane Dust to breed a Special Familiar.");
          return;
        }
        setBusy(true);
        try {
          const spec = FAMILIAR_SPECIES[f1.species] || FAMILIAR_SPECIES.Bat;
          const mergedElements = [...new Set([...(f1.elements || []), ...(f2.elements || [])])];
          const bred = {
            id: Date.now() + Math.floor(Math.random() * 999),
            category: "familiar",
            species: f1.species,
            icon: spec.icon,
            name: spec.specialBreed,
            elements: mergedElements,
            isSpecialBreed: true,
            rarity: "legendary",
            tier: Math.max(f1.tier || 1, f2.tier || 1) + 1,
            powerBonus: Math.round(((f1.powerBonus || 20) + (f2.powerBonus || 20)) * 0.9 + 20),
            marketValue: Math.round(((f1.marketValue || 40) + (f2.marketValue || 40)) * 1.35)
          };
          const res = await fetch("/api/mandaloz/nft/mint", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ address: walletAddress, action: "FAMILIAR_BREED", nft: bred, costCrow: 45, parentIds: [f1.id, f2.id] })
          }).then(r => r.json());
          if (!res?.ok) {
            setChainStatus(res?.error || "Familiar combine failed.");
            return;
          }
          const minted = res.nft || bred;
          const nextFams = (player.familiars || []).filter(f => f.id !== f1.id && f.id !== f2.id).concat(minted);
          const nextMats = { ...(player.materials || {}), essence: (player.materials?.essence || 0) - 2 };
          const nextEq = { ...(player.equipped || {}) };
          if (nextEq.familiar === f1.id || nextEq.familiar === f2.id) nextEq.familiar = minted.id;
          await savePlayerProfile({ ...player, familiars: nextFams, materials: nextMats, equipped: nextEq });
          setFamPickA(null);
          setFamPickB(null);
          setChainStatus(`✨ Bred Special ${minted.icon} ${minted.name} (${mergedElements.join("/")})! • Block #${res.block?.block_number || "?"}`);
          await refreshChain(walletAddress);
        } finally {
          setBusy(false);
        }
      };

      const consumeCombatAmmoAndBoost = (p) => {
        const eq = { ...(p.equipped || {}) };
        let nextCons = [...(p.consumables || [])];
        const wpn = (p.gear || []).find(g => g.id === eq.weapon);
        if (wpn?.weaponKind === "bow" && eq.quiver) {
          nextCons = nextCons.map(c => c.id === eq.quiver ? { ...c, qty: Math.max(0, (c.qty || 0) - 1) } : c).filter(c => (c.qty ?? 1) > 0);
          if (!nextCons.some(c => c.id === eq.quiver)) eq.quiver = null;
        }
        return { consumables: nextCons, equipped: eq, battleBoost: 0 };
      };

      const usePotion = async (pot) => {
        if (!player || (pot.qty || 0) <= 0) return;
        const nextCons = (player.consumables || [])
          .map(c => c.id === pot.id ? { ...c, qty: Math.max(0, (c.qty || 0) - 1) } : c)
          .filter(c => (c.qty ?? 1) > 0);
        if (pot.effect === "energy") {
          const nextEnergy = (player.energy ?? 10) + (pot.amount || 2);
          await savePlayerProfile({ ...player, energy: nextEnergy, consumables: nextCons });
          setChainStatus(`Used ${pot.name}: +${pot.amount || 2} Energy! (${Math.max(0, (pot.qty || 1) - 1)} uses left)`);
        } else {
          const nextBoost = (player.battleBoost || 0) + (pot.amount || 25);
          await savePlayerProfile({ ...player, battleBoost: nextBoost, consumables: nextCons });
          setChainStatus(`Used ${pot.name}: +${pot.amount || 25} Power active for your next Arena battle!`);
        }
      };

      const runMapEncounter = async (enc, isRaid = false) => {
        if (!player) return;
        const fighter = (player.collection || []).find(m => m.id === (player.equipped?.mandala || fighterId)) || (player.collection || [])[0];
        if (!fighter) {
          setChainStatus("You need a Mandala NFT to enter!");
          return { win: false, msg: "You need a Mandala NFT to enter!" };
        }
        if ((player.level || 1) < enc.minLevel) {
          const m = `${enc.name} requires Level ${enc.minLevel}+.`;
          setChainStatus(m);
          return { win: false, msg: m };
        }
        if ((player.energy ?? 10) < enc.energyCost) {
          const m = `Need ${enc.energyCost} Energy to enter ${enc.name}.`;
          setChainStatus(m);
          return { win: false, msg: m };
        }
        setBusy(true);
        try {
          const playerScore = (fighter.fusionPower || 60) + (player.level || 1) * 15 + getEquippedPowerBonus(player) + Math.floor(Math.random() * 45);
          const win = playerScore >= enc.power;
          const nextXp = (player.xp || 0) + (win ? (isRaid ? 160 : 75) : 15);
          const nextEnergy = Math.max(0, (player.energy ?? 10) - enc.energyCost);
          if (!win) {
            await savePlayerProfile({ ...player, energy: nextEnergy, xp: nextXp, level: calcLevel(nextXp) });
            const m = `Repelled by ${enc.name} (${playerScore} vs ${enc.power}). -${enc.energyCost} Energy, +15 XP.`;
            setChainStatus(m);
            return { win: false, msg: m };
          }
          const nextMats = { ...(player.materials || {}) };
          Object.entries(enc.mats || {}).forEach(([k, v]) => { nextMats[k] = (nextMats[k] || 0) + v; });
          const alreadyOwned = (player.abilities || []).some(a => a.name === enc.dropAbility.name) || pendingMints.some(p => p.name === enc.dropAbility.name);
          const dropChance = isRaid ? 0.85 : 0.65;
          const dropped = (!alreadyOwned && Math.random() < dropChance) ? {
            id: Date.now() + Math.floor(Math.random() * 999),
            category: "ability",
            ...enc.dropAbility,
            source: enc.name
          } : null;
          const nextPending = dropped ? [...pendingMints, dropped] : pendingMints;
          const prevStats = player.stats || {};
          await savePlayerProfile({
            ...player,
            energy: nextEnergy,
            xp: nextXp,
            level: calcLevel(nextXp),
            materials: nextMats,
            pendingMints: nextPending,
            stats: {
              ...prevStats,
              dungeons: (prevStats.dungeons || 0) + (isRaid ? 0 : 1),
              raids: (prevStats.raids || 0) + (isRaid ? 1 : 0)
            }
          });
            setChainStatus(
              dropped
                ? `Cleared ${enc.name}! Found Unminted Ability "${dropped.name}" — take it to ⛩️ MandalOz Shrine to mint it on-chain!`
                : `Cleared ${enc.name}! Gathered materials & +${isRaid ? 160 : 75} XP.`
            );
            return {
              win: true,
              msg: dropped
                ? `⚔️ Cleared ${enc.name}! Dropped Unminted Ability "${dropped.name}" — check ⛩️ MandalOz Shrine!`
                : `⚔️ Cleared ${enc.name}! +${isRaid ? 160 : 75} XP & materials!`
            };
          } catch (e) {
            return { win: false, msg: "Encounter error." };
          } finally {
            setBusy(false);
          }
      };

      const mintPendingDrop = async (drop) => {
        if (!player) return;
        if (usedPouchSlots >= pouchCapacity) {
          setChainStatus(`Pouch full (${usedPouchSlots}/${pouchCapacity} slots)! Upgrade your Pouch or sell/auction items first.`);
          return;
        }
        const curEssence = player.materials?.essence || 0;
        if (curEssence < (drop.mintEssence || 0)) {
          setChainStatus(`Need ${drop.mintEssence} Arcane Dust to mint "${drop.name}" at MandalOz Shrine.`);
          return;
        }
        if (liveCrow < (drop.mintCrow || 25)) {
          setChainStatus(`Need ${drop.mintCrow} CROW to mint "${drop.name}".`);
          return;
        }
        setBusy(true);
        try {
          const nftObj = {
            id: drop.id,
            category: "ability",
            name: drop.name,
            tier: drop.rarity === "epic" ? 3 : 2,
            rarity: drop.rarity,
            powerBonus: drop.powerBonus,
            desc: drop.desc,
            source: drop.source,
            marketValue: Math.round((drop.mintCrow || 25) * 1.4)
          };
          const res = await fetch("/api/mandaloz/nft/mint", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ address: walletAddress, action: "SHRINE_MINT", nft: nftObj, costCrow: drop.mintCrow || 25 })
          }).then(r => r.json());
          if (!res?.ok) {
            setChainStatus(res?.error || "Shrine mint failed.");
            return;
          }
          const nextMats = { ...(player.materials || {}), essence: curEssence - (drop.mintEssence || 0) };
          const nextPending = (player.pendingMints || []).filter(p => p.id !== drop.id);
          const nextAbilities = [...(player.abilities || []), res.nft || nftObj];
          const prevStats = player.stats || {};
          const nextXp = (player.xp || 0) + 60;
          await savePlayerProfile({
            ...player,
            xp: nextXp,
            level: calcLevel(nextXp),
            materials: nextMats,
            pendingMints: nextPending,
            abilities: nextAbilities,
            equipped: { ...(player.equipped || {}), ability: player.equipped?.ability || (res.nft || nftObj).id },
            stats: { ...prevStats, shrineMints: (prevStats.shrineMints || 0) + 1 }
          });
          setChainStatus(`⛩️ MandalOz minted "${drop.name}" onto CROW Chain! • Block #${res.block?.block_number || "?"}`);
          await refreshChain(walletAddress);
        } finally {
          setBusy(false);
        }
      };

      const craftPouch = async (tierObj) => {
        if (!player) return;
        const mats = player.materials || {};
        for (const [k, need] of Object.entries(tierObj.mats)) {
          if ((mats[k] || 0) < need) {
            setChainStatus(`Need ${need} ${MAT_META[k]?.label || k} to craft ${tierObj.name}.`);
            return;
          }
        }
        if (liveCrow < tierObj.crowCost) {
          setChainStatus(`Need ${tierObj.crowCost} CROW to craft ${tierObj.name}.`);
          return;
        }
        setBusy(true);
        try {
          const pouchNft = {
            id: Date.now(),
            category: "pouch",
            name: tierObj.name,
            tier: tierObj.tier,
            rarity: tierObj.rarity,
            capacity: tierObj.capacity,
            marketValue: tierObj.marketValue
          };
          const res = await fetch("/api/mandaloz/nft/mint", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ address: walletAddress, action: "POUCH_CRAFT", nft: pouchNft, costCrow: tierObj.crowCost })
          }).then(r => r.json());
          if (!res?.ok) {
            setChainStatus(res?.error || "Pouch craft failed.");
            return;
          }
          const nextMats = { ...mats };
          Object.entries(tierObj.mats).forEach(([k, need]) => { nextMats[k] = (nextMats[k] || 0) - need; });
          const crafted = res.nft || pouchNft;
          await savePlayerProfile({
            ...player,
            materials: nextMats,
            pouch: crafted,
            pouches: [...(player.pouches || []), crafted],
            equipped: { ...(player.equipped || {}), pouch: crafted.id }
          });
          setChainStatus(`Crafted & equipped ${crafted.name} (${crafted.capacity} slots)! • Block #${res.block?.block_number || "?"}`);
          await refreshChain(walletAddress);
        } finally {
          setBusy(false);
        }
      };

      const equipPouch = async (pouchObj) => {
        if (!player) return;
        await savePlayerProfile({ ...player, pouch: pouchObj, equipped: { ...(player.equipped || {}), pouch: pouchObj.id } });
        setChainStatus(`Equipped ${pouchObj.name} (${pouchObj.capacity} slots).`);
      };

      const equipAbility = async (abObj) => {
        if (!player) return;
        await savePlayerProfile({ ...player, equipped: { ...(player.equipped || {}), ability: abObj.id } });
        setChainStatus(`Equipped Ability: ${abObj.name} (+${abObj.powerBonus} Power).`);
      };

      const listGenericOnAuction = async (name, minBid, tierLabel, itemData, onSuccess) => {
        if (!player) return;
        setBusy(true);
        try {
          const res = await window.CrowChain.listAuction(walletAddress, name, minBid, tierLabel, itemData);
          if (!res?.ok) {
            setChainStatus(res?.error || "Auction listing failed.");
            return;
          }
          await onSuccess();
          setChainStatus(`Listed "${name}" on CROW Auction House • Block #${res.block?.block_number || "?"}`);
          await refreshAuctions();
          await refreshChain(walletAddress);
        } finally {
          setBusy(false);
        }
      };

      // ==================== LOGIN SCREEN ====================
      if (!loggedIn || !player) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">
            <div className="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-3xl p-7 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-950 text-emerald-300 border border-emerald-700/50">
                  Powered by CROW Chain
                </div>
                <h1 className="text-3xl font-black text-white">🗡️ MandalOz 3D</h1>
                <p className="text-xs text-slate-400">Start at Level 1, log in with a CROW Wallet, battle Guardians, collect &amp; fuse Mandala NFTs, and trade on the live Auction House.</p>
              </div>

              {/* New Level 1 Player */}
              <form onSubmit={handleStartNewPlayer} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3">
                <div className="text-xs font-bold uppercase text-emerald-400">New Player — Start at Level 1</div>
                <input
                  type="text"
                  value={newPlayerName}
                  onChange={(e) => setNewPlayerName(e.target.value)}
                  placeholder="Enter your Player Name (e.g. Shane)"
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                />
                <button type="submit" disabled={busy} className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-black text-white shadow-lg">
                  {busy ? "Creating Wallet..." : "✨ Create Level 1 Account & Start"}
                </button>
              </form>

              {/* Existing Wallet Login */}
              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3">
                <div className="text-xs font-bold uppercase text-sky-400">Returning Player — Login with CROW Wallet</div>
                <select
                  value={loginWalletPick}
                  onChange={(e) => setLoginWalletPick(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 font-mono"
                >
                  {accounts.length === 0 && <option value="">No existing wallets found</option>}
                  {accounts.map(a => (
                    <option key={a.address} value={a.address}>
                      {(a.label || "Wallet")} ({a.address.slice(0, 6)}...{a.address.slice(-4)}) — {Number(a.crow_balance || 0).toFixed(1)} CROW
                    </option>
                  ))}
                </select>
                <button onClick={handleLoginExisting} disabled={busy || !loginWalletPick} className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-xs font-black text-white">
                  🔑 Login &amp; Resume Adventure
                </button>
              </div>

              <div className="flex items-center justify-between text-xs text-slate-500 pt-1">
                <span>{chainStatus}</span>
                <a href="/index.html" className="text-indigo-400 hover:underline">← Maz Wallet Hub</a>
              </div>
            </div>
          </div>
        );
      }

      const curLevelObj = LEVELS.find(l => l.level === (player.level || 1)) || LEVELS[0];
      const nextLevelObj = LEVELS.find(l => l.level === (player.level || 1) + 1);
      const xpPct = nextLevelObj
        ? Math.min(100, Math.round((((player.xp || 0) - curLevelObj.xp) / (nextLevelObj.xp - curLevelObj.xp)) * 100))
        : 100;

      const GUARDIANS = [

                }}
                onEncounterEnemy={async (enemy) => {
                  if (activeLabyrinthZone?.type === "dungeon" && activeLabyrinthZone.encounter) {
                    return await runMapEncounter(activeLabyrinthZone.encounter, false);
                  }
                  if (activeLabyrinthZone?.type === "raid" && activeLabyrinthZone.encounter) {
                    return await runMapEncounter(activeLabyrinthZone.encounter, true);
                  }
                  if (activeLabyrinthZone?.type === "guardian" && activeLabyrinthZone.guardian) {
                    const fighter = (player.collection || []).find(m => m.id === fighterId) || (player.collection || [])[0];
                    if (!fighter) return { win: false, msg: "You need at least 1 Mandala NFT in your collection to battle!" };
                    if ((player.energy ?? 10) <= 0) return { win: false, msg: "Out of daily energy (0/10)!" };
                    const playerScore = (fighter.fusionPower || 60) + (player.level || 1) * 15 + getEquippedPowerBonus(player) + (player.battleBoost || 0) + Math.floor(Math.random() * 40);
                    await battleGuardian(activeLabyrinthZone.guardian);
                    const won = playerScore >= activeLabyrinthZone.guardian.power;
                    return { win: won, msg: won ? `⚔️ Defeated ${activeLabyrinthZone.guardian.name}! Check Battle Log & CROW Chain!` : `💥 ${activeLabyrinthZone.guardian.name} held! Check Battle Log.` };
                  }
                  const fighter = (player.collection || []).find(m => m.id === fighterId) || (player.collection || [])[0];
                  if (!fighter) return { win: false, msg: "You need at least 1 Mandala NFT in your collection to battle!" };
                  if ((player.energy ?? 10) <= 0) return { win: false, msg: "Out of daily energy (0/10)!" };
                  const playerScore = (fighter.fusionPower || 60) + (player.level || 1) * 15 + getEquippedPowerBonus(player) + (player.battleBoost || 0) + Math.floor(Math.random() * 40);
                  const combatConsumed = consumeCombatAmmoAndBoost(player);
                  const win = enemy?.tacticalVictory ? true : (playerScore >= enemy.power);
                  if (!win) {
                    const nextXp = (player.xp || 0) + 15;
                    await savePlayerProfile({ ...player, ...combatConsumed, energy: Math.max(0, (player.energy ?? 10) - 1), xp: nextXp, level: calcLevel(nextXp) });
                    return { win: false, msg: `💥 Defeated by ${enemy.name} (${playerScore} vs ${enemy.power}). -1 Energy, +15 XP!` };
                  }
                  const nextXp = (player.xp || 0) + 50;
                  await savePlayerProfile({ ...player, ...combatConsumed, energy: Math.max(0, (player.energy ?? 10) - 1), xp: nextXp, level: calcLevel(nextXp), ringShards: (player.ringShards || 0) + 1 });
                  setChainStatus(`⚔️ Defeated ${enemy.name} (${playerScore} vs ${enemy.power}): +50 XP, +1 Shattered Ring Shard!`);
                  return { win: true, msg: `⚔️ Victory vs ${enemy.name} (${playerScore} vs ${enemy.power})! +50 XP, +1 Ring Shard — path opened!` };
                }}
                onBuyShopItem={async (itemType, costCrow) => {
                  if (!player || liveCrow < costCrow) return `Need ${costCrow} CROW!`;
                  const pay = await window.CrowChain.spend(walletAddress, costCrow, "MandalOz 3D", `Labyrinth Shop: ${itemType}`);
                  if (!pay?.ok) return pay?.error || "Payment failed.";
                  if (itemType === "energy") {
                    await savePlayerProfile({ ...player, energy: (player.energy ?? 10) + 2 });
                    return "⚡ Bought +2 Energy in the Labyrinth Shop!";
                  }
                  if (itemType === "elixir") {
                    await savePlayerProfile({ ...player, battleBoost: (player.battleBoost || 0) + 30 });
                    return "🧪 Bought +30 Power Elixir for your next battle!";
                  }
                  await savePlayerProfile({ ...player, ringShards: (player.ringShards || 0) + 1 });
                  return "💍 Bought +1 Shattered Ring Shard!";
                }}
              />
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                {[
                  ["Plot #001 — Elemental Plains", "Drops: Timber, Hide, Herbs + CROW", [["wall","grass","water","grass","wall"],["grass","chest","grass","blocker","water"],["water","grass","blocker","grass","grass"],["grass","grass","grass","chest","water"],["wall","grass","grass","grass","wall"]]],
                  ["Plot #002 — Crystal Mountains", "Drops: Iron Ore, Timber, Arcane Dust + CROW", [["wall","ice","stone","ice","wall"],["ice","chest","stone","blocker","ice"],["stone","ice","blocker","stone","ice"],["ice","stone","stone","chest","stone"],["wall","stone","stone","ice","wall"]]],
                  ["Plot #003 — Aetheris Citadel", "Drops: Arcane Dust, Iron Ore, Herbs + CROW", [["wall","electric","lava","electric","wall"],["electric","chest","stone","blocker","lava"],["lava","stone","blocker","electric","stone"],["electric","lava","stone","chest","electric"],["wall","stone","stone","stone","wall"]]]
                ].map(([name, desc, realmMap]) => (
                  <div key={name} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                    <div className="text-sm font-bold text-white">🌐 {name}</div>
                    <p className="text-xs text-slate-400">{desc}</p>
                    <div className="text-xs text-amber-400 font-bold">Harvested: {(player.realmHarvests || {})[name] || 0} CROW</div>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => launchLabyrinthZone({
                          id: `realm-${name}`,
                          type: "realm",
                          title: `🌐 3D Realm — ${name}`,
                          subtitle: `${desc}. Explore tiles, loot chests & defeat Guardians!`,
                          map: realmMap,
                          guardName: "Realm Guardian",
                          guardPower: 90,
                          energyCost: 1
                        })}
                        className="py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white"
                      >
                        🏰 Explore 3D
                      </button>
                      <button onClick={() => harvestRealm(name)} disabled={busy} className="py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white">
                        ⚡ Quick Harvest
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              {/* Side Dungeons & Raid Bosses (Unminted Ability Drops) */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div className="bg-slate-900 border border-violet-500/40 rounded-2xl p-5 space-y-3">
                  <div>
                    <h3 className="text-sm font-black text-violet-300">🚪 Map Side Dungeons (3D Labyrinth + Ability Drops)</h3>
                    <p className="text-xs text-slate-400">Enter any Side Dungeon in 3D Over-the-Shoulder mode to fight its Boss for Unminted Abilities.</p>
                  </div>
                  {SIDE_DUNGEONS.map(d => (
                    <div key={d.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <div className="text-xs font-bold text-white">{d.name} <span className="text-slate-400">(Lv.{d.minLevel}+ • Pwr {d.power})</span></div>
                        <div className="text-[11px] text-amber-300">Drop: {d.dropAbility.name} ({d.dropAbility.rarity}) • -1 Energy</div>
                      </div>
                      <button
                        onClick={() => launchLabyrinthZone({
                          id: `dungeon-${d.id}`,
                          type: "dungeon",
                          encounter: d,
                          title: `🚪 3D Side Dungeon — ${d.name}`,
                          subtitle: `Defeat ${d.name} (Power ${d.power}) inside the Labyrinth to roll for ${d.dropAbility.name}!`,
                          map: [
                            ["wall","stone","chest","stone","wall"],
                            ["stone","wall","blocker","wall","stone"],
                            ["stone","ice","stone","electric","stone"],
                            ["stone","chest","stone","blocker","stone"],
                            ["wall","stone","stone","stone","wall"]
                          ],
                          bossName: d.name,
                          bossPower: d.power,
                          guardName: `${d.name} Guard`,
                          guardPower: Math.max(75, d.power - 20),
                          energyCost: d.energyCost || 1
                        })}
                        disabled={busy}
                        className="px-3 py-1.5 rounded-lg bg-violet-600 hover:bg-violet-500 text-xs font-bold text-white"
                      >
                        🏰 Enter 3D Dungeon
                      </button>
                    </div>
                  ))}
                </div>

                <div className="bg-slate-900 border border-rose-500/40 rounded-2xl p-5 space-y-3">
                  <div>
                    <h3 className="text-sm font-black text-rose-400">💀 Raid Bosses (3D Labyrinth + Epic Soul Relics)</h3>
                    <p className="text-xs text-slate-400">Enter a Raid Boss chamber in 3D mode to battle high-power bosses for Epic Unminted Abilities.</p>
                  </div>
                  {RAID_BOSSES.map(b => (
                    <div key={b.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <div className="text-xs font-bold text-white">{b.name} <span className="text-slate-400">(Lv.{b.minLevel}+ • Pwr {b.power})</span></div>
                        <div className="text-[11px] text-rose-300">Drop: {b.dropAbility.name} (+{b.dropAbility.powerBonus} Pwr) • -{b.energyCost} Energy</div>
                      </div>
                      <button
                        onClick={() => launchLabyrinthZone({
                          id: `raid-${b.id}`,
                          type: "raid",
                          encounter: b,
                          title: `💀 3D Raid Chamber — ${b.name}`,
                          subtitle: `Defeat Raid Boss ${b.name} (Power ${b.power}) for Epic Relic ${b.dropAbility.name}!`,
                          map: [
                            ["wall","lava","chest","lava","wall"],
                            ["lava","stone","blocker","stone","lava"],
                            ["lava","electric","lava","electric","lava"],
                            ["stone","chest","lava","chest","stone"],
                            ["wall","lava","stone","lava","wall"]
                          ],
                          bossName: b.name,
                          bossPower: b.power,
                          guardName: b.name,
                          guardPower: b.power,
                          energyCost: b.energyCost || 2
                        })}
                        disabled={busy}
                        className="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-xs font-bold text-white"
                      >
                        🏰 Enter 3D Raid
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* LEADERBOARD & BLOCKS */}
          {currentView === "chain" && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <h2 className="text-sm font-bold text-white">🏆 MandalOz Player Leaderboard</h2>
                <div className="space-y-2 text-xs">
                  {leaderboard.map((p, i) => (
                    <div key={p.address} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 flex items-center justify-between">
                      <div>
                        <span className="font-black text-amber-400 mr-2">#{i + 1}</span>
                        <span className="font-bold text-white">{p.username}</span>
                        <span className="text-slate-500 font-mono ml-2">({p.address.slice(0, 8)}...)</span>
                      </div>
                      <div className="text-slate-300">Lv.{p.level} • {p.xp} XP • {(p.collection || []).length} NFTs</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <h2 className="text-sm font-bold text-white">⛓️ Latest CROW Chain Blocks</h2>
                <div className="space-y-2 text-xs">
                  {recentBlocks.slice(0, 8).map(b => (
                    <div key={b.block_number} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 flex items-center justify-between">
                      <span className="font-bold text-emerald-400">Block #{b.block_number}</span>
                      <span className="font-mono text-slate-400">{(b.block_hash || "").slice(0, 18)}...</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
